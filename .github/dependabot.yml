version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /examples/go/consumer
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /sdks/node
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /sdks/python
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /sdks/java
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
