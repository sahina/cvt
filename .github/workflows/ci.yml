name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Build and test Go server
  server:
    name: Build & Test Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Build server
        run: go build -v -o cvt ./cmd/cvt

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./server/...

      - name: Generate coverage report
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-report
          path: |
            coverage.out
            coverage.html

      - name: Check coverage threshold
        run: |
          # Exclude generated protobuf code from coverage calculation
          grep -v "/server/pb/" coverage.out > coverage.filtered.out
          coverage=$(go tool cover -func=coverage.filtered.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage (excluding generated pb/ code): ${coverage}%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "Coverage ${coverage}% is below threshold of 70%"
            exit 1
          fi

  # Integration tests (requires Docker)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdks/node/package-lock.json

      - name: Start CVT server
        run: |
          docker compose up -d
          sleep 10

      - name: Wait for server health check
        run: |
          timeout 30 sh -c 'until docker inspect cvt-server --format="{{.State.Health.Status}}" | grep -q healthy; do sleep 1; done' || {
            echo "Server health check failed"
            docker compose logs
            docker compose down
            exit 1
          }
          echo "Server is healthy!"

      - name: Install Node SDK dependencies
        working-directory: ./sdks/node
        run: npm ci

      - name: Run Node SDK integration tests
        working-directory: ./sdks/node
        run: npm test
        env:
          CVT_SERVER_ADDRESS: localhost:9550

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python SDK dependencies
        working-directory: ./sdks/python
        run: uv sync

      - name: Run Python SDK integration tests
        working-directory: ./sdks/python
        run: uv run pytest tests/

      - name: Set up Go for integration tests
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sdks/go/go.sum

      - name: Install Go SDK dependencies
        working-directory: ./sdks/go
        run: go mod download

      - name: Run Go SDK integration tests
        working-directory: ./sdks/go
        run: go test -v ./...

      - name: Set up JDK 21 for Java SDK tests
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Java SDK integration tests
        working-directory: ./sdks/java
        run: mvn test
        env:
          CVT_SERVER_ADDRESS: localhost:9550

      - name: Show server logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            sdks/node/coverage/
            sdks/python/htmlcov/
            sdks/go/coverage.out
            sdks/java/target/

  # Build and smoke-test CLI
  cli:
    name: Build & Test CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Build CLI
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//') || VERSION="dev"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${DATE}" \
            -o cvt ./cmd/cvt

      - name: Run unit tests
        run: go test -v -race ./cmd/cvt/...

      - name: Smoke test - version
        run: |
          ./cvt version
          ./cvt --version

      - name: Smoke test - help
        run: |
          ./cvt --help
          ./cvt validate --help

      - name: Smoke test - validate (valid interaction)
        run: |
          ./cvt validate \
            --schema examples/schemas/user-api-v1.json \
            --interaction examples/fixtures/valid-interaction.json

      - name: Smoke test - validate JSON output
        run: |
          OUTPUT=$(./cvt validate \
            --schema examples/schemas/user-api-v1.json \
            --interaction examples/fixtures/valid-interaction.json \
            --json)
          echo "$OUTPUT"
          echo "$OUTPUT" | jq -e '.valid == true'

      - name: Smoke test - validate (invalid interaction, expect failure)
        run: |
          if ./cvt validate \
            --schema examples/schemas/user-api-v1.json \
            --interaction examples/fixtures/invalid-interaction.json 2>/dev/null; then
            echo "Expected validation to fail but it succeeded"
            exit 1
          fi
          echo "Correctly rejected invalid interaction"

      - name: Smoke test - compare (same schema, expect compatible)
        run: |
          ./cvt compare \
            --old examples/schemas/user-api-v1.json \
            --new examples/schemas/user-api-v1.json

      - name: Smoke test - compare (breaking changes, expect failure)
        run: |
          if ./cvt compare \
            --old examples/schemas/user-api-v1.json \
            --new examples/schemas/user-api-v2.json 2>/dev/null; then
            echo "Expected compare to detect breaking changes but it did not"
            exit 1
          fi
          echo "Correctly detected breaking changes"

      - name: Smoke test - compare JSON output
        run: |
          OUTPUT=$(./cvt compare \
            --old examples/schemas/user-api-v1.json \
            --new examples/schemas/user-api-v2.json \
            --json || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | jq -e '.compatible == false'
          echo "$OUTPUT" | jq -e '.breaking_changes | length > 0'

      - name: Smoke test - generate (list endpoints)
        run: |
          ./cvt generate \
            --schema examples/schemas/user-api-v1.json \
            --list

      - name: Smoke test - generate fixture
        run: |
          ./cvt generate \
            --schema examples/schemas/user-api-v1.json \
            --method GET --path /users/{id}

      - name: Smoke test - generate request body
        run: |
          ./cvt generate \
            --schema examples/schemas/user-api-v1.json \
            --method POST --path /users \
            --output-type request

      - name: Smoke test - error handling (nonexistent schema)
        run: |
          if ./cvt validate \
            --schema nonexistent.json \
            --interaction examples/fixtures/valid-interaction.json 2>/dev/null; then
            echo "Expected failure for nonexistent schema but succeeded"
            exit 1
          fi
          echo "Correctly failed for nonexistent schema"

  # Build and test Node.js SDK
  node-sdk:
    name: Build & Test Node SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdks/node/package-lock.json

      - name: Install dependencies
        working-directory: ./sdks/node
        run: npm ci

      - name: Build Node SDK
        working-directory: ./sdks/node
        run: npm run build

      - name: Run tests
        working-directory: ./sdks/node
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-sdk-test-results
          path: sdks/node/coverage/

  # Build and test Python SDK
  python-sdk:
    name: Build & Test Python SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ./sdks/python
        run: uv sync

      - name: Run tests with coverage
        working-directory: ./sdks/python
        run: uv run pytest --cov=cvt_sdk --cov-report=term-missing --cov-report=html tests/

      - name: Check coverage threshold
        working-directory: ./sdks/python
        run: |
          # Exclude generated protobuf code from coverage calculation
          coverage=$(uv run coverage report --omit="cvt_sdk/proto/*" | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Total coverage (excluding generated proto/ code): ${coverage}%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "Coverage ${coverage}% is below threshold of 70%"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-test-results
          path: sdks/python/htmlcov/

  # Build and test Go SDK
  go-sdk:
    name: Build & Test Go SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sdks/go/go.sum

      - name: Install dependencies
        working-directory: ./sdks/go
        run: go mod download

      - name: Run tests with coverage
        working-directory: ./sdks/go
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./cvt/...

      - name: Check coverage threshold
        working-directory: ./sdks/go
        run: |
          # Exclude generated protobuf code from coverage calculation
          grep -v "/proto/" coverage.out > coverage.filtered.out
          coverage=$(go tool cover -func=coverage.filtered.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage (excluding generated proto/ code): ${coverage}%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "Coverage ${coverage}% is below threshold of 70%"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-sdk-coverage
          path: sdks/go/coverage.out

  # Build and test Java SDK
  java-sdk:
    name: Build & Test Java SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build Java SDK
        working-directory: ./sdks/java
        run: mvn compile -DskipTests

      - name: Run tests with coverage
        working-directory: ./sdks/java
        run: mvn test jacoco:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sdk-test-results
          path: |
            sdks/java/target/surefire-reports/
            sdks/java/target/site/jacoco/

  # Build Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [server, cli, node-sdk, python-sdk, go-sdk, java-sdk]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cvt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker compose up -d
          sleep 10

          # Check container health
          docker ps

          # Wait for health check to pass
          timeout 30 sh -c 'until docker inspect cvt-server --format="{{.State.Health.Status}}" | grep -q healthy; do sleep 1; done' || {
            echo "Health check failed"
            docker compose logs
            docker compose down
            exit 1
          }

          echo "Container is healthy!"
          docker compose logs
          docker compose down

  # Code quality checks
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Run go fmt check
        run: |
          UNFORMATTED=$(gofmt -l ./server/ ./pkg/ ./cmd/cvt/)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files are not formatted. Run 'go fmt ./...' to fix."
            echo "$UNFORMATTED"
            gofmt -d ./server/ ./pkg/ ./cmd/cvt/
            exit 1
          fi

      - name: Run go vet
        run: go vet ./server/... ./pkg/... ./cmd/cvt/...

      - name: Install golangci-lint
        run: |
          LINT_VERSION=$(grep 'golangci-lint' mise.toml | sed 's/.*= *"\(.*\)"/\1/')
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin "v${LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./server/... ./pkg/... ./cmd/...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdks/node/package-lock.json

      - name: Install Node SDK dependencies
        working-directory: ./sdks/node
        run: npm ci

      - name: Run ESLint
        working-directory: ./sdks/node
        run: npm run lint

      - name: Run Prettier check
        working-directory: ./sdks/node
        run: npm run format:check

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python for linting
        run: uv python install 3.12

      - name: Install Python SDK dependencies
        working-directory: ./sdks/python
        run: uv sync

      - name: Run Ruff linter
        working-directory: ./sdks/python
        run: uv run ruff check .

      - name: Run Ruff formatter check
        working-directory: ./sdks/python
        run: uv run ruff format --check .

      - name: Run go fmt check for Go SDK
        working-directory: ./sdks/go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run 'go fmt ./...' to fix."
            gofmt -d .
            exit 1
          fi

      - name: Run go vet for Go SDK
        working-directory: ./sdks/go
        run: go vet ./...

      - name: Set up JDK 21 for Java linting
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Java verify
        working-directory: ./sdks/java
        run: mvn verify -DskipTests
