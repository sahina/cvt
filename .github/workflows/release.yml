name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (contains -alpha, -beta, -rc, etc.)
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Build and Push Docker Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sahina/cvt-server:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.prerelease == 'false' && 'ghcr.io/sahina/cvt-server:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-node:
    name: Publish Node.js SDK
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sahina'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish ${{ needs.validate.outputs.prerelease == 'true' && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-java:
    name: Publish Java SDK
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version
        run: mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Verify
        run: mvn verify

      - name: Deploy
        run: mvn deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-python:
    name: Publish Python SDK
    needs: [validate, release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version
        run: sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest tests/

      - name: Build
        run: uv build

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sdks/python/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-tag:
    name: Tag Go SDK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create and push Go SDK tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="sdks/go/v${VERSION}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          VERSION: ${{ needs.validate.outputs.version }}

  release:
    name: Create GitHub Release
    needs: [validate, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
