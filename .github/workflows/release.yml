name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build CLI for (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"

          # Normalize to full semver (e.g., 0.2 -> 0.2.0)
          DOTS=$(echo "$VERSION" | tr -cd '.' | wc -c | tr -d ' ')
          if [ "$DOTS" -eq 0 ]; then
            VERSION="${VERSION}.0.0"
          elif [ "$DOTS" -eq 1 ]; then
            VERSION="${VERSION}.0"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (contains -alpha, -beta, -rc, etc.)
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Build and Push Docker Image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sahina/cvt-server:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.prerelease == 'false' && 'ghcr.io/sahina/cvt-server:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-node:
    name: Publish Node.js SDK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@sahina'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npmjs
        run: |
          if npm view "@sahina/cvt-sdk@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already exists on npmjs, skipping"
          else
            npm publish --access public ${{ needs.validate.outputs.prerelease == 'true' && '--tag next' || '' }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}

  publish-java-central:
    name: Publish Java SDK to Maven Central
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Set version
        run: mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Import GPG key
        run: echo "$MAVEN_GPG_KEY" | gpg --batch --import
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}

      - name: Deploy to Maven Central
        run: mvn deploy -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-python:
    name: Publish Python SDK to PyPI
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version
        run: sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest tests/

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  go-tag:
    name: Tag Go SDK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create and push Go SDK tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="sdks/go/v${VERSION}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          VERSION: ${{ needs.validate.outputs.version }}

  goreleaser:
    name: Release CLI (GoReleaser)
    needs: validate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
