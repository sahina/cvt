name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build CLI for (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"

          # Normalize to full semver (e.g., 0.2 -> 0.2.0, 1.0-rc.1 -> 1.0.0-rc.1)
          BASE="${VERSION%%-*}"
          PRE=""
          if [ "$BASE" != "$VERSION" ]; then
            PRE="-${VERSION#*-}"
          fi
          DOTS=$(echo "$BASE" | tr -cd '.' | wc -c | tr -d ' ')
          if [ "$DOTS" -eq 0 ]; then
            BASE="${BASE}.0.0"
          elif [ "$DOTS" -eq 1 ]; then
            BASE="${BASE}.0"
          fi
          VERSION="${BASE}${PRE}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (contains -alpha, -beta, -rc, etc.)
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Build and Push Docker Image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sahina/cvt:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.prerelease == 'false' && 'ghcr.io/sahina/cvt:latest' || '' }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.pushed_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-agent-skills:
    name: Update Agent Skills Version
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update skills VERSION file
        run: echo "$VERSION" > .agents/skills/VERSION
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Update sdk_version in SKILL.md frontmatter
        run: |
          find .agents/skills -name 'SKILL.md' -exec sed -i "s/^sdk_version: .*/sdk_version: \"$VERSION\"/" {} +
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Update template version comments
        run: |
          find .agents/skills -name '*.tmpl' -exec sed -i "s|CVT SDK v[0-9][0-9.]*[-a-zA-Z.0-9]*|CVT SDK v$VERSION|" {} +
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Create version bump PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .agents/; then
            echo "No agent skills version changes needed"
          else
            BRANCH="chore/bump-skills-$VERSION"
            # Clean up any stale branch from a previous failed run
            git push origin --delete "$BRANCH" 2>/dev/null || true
            git branch -D "$BRANCH" 2>/dev/null || true
            git checkout -b "$BRANCH"
            git add .agents/
            git commit -m "chore: bump agent skills version to $VERSION"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: bump agent skills version to $VERSION" \
              --body "Auto-generated by release workflow. Bumps agent skills VERSION, SKILL.md frontmatter, and template version comments to $VERSION." \
              --base main \
              --head "$BRANCH"
            gh pr merge "$BRANCH" --squash --delete-branch
          fi
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-node:
    name: Publish Node.js SDK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@sahina'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npmjs
        run: |
          if npm view "@sahina/cvt-sdk@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already exists on npmjs, skipping"
          else
            npm publish --access public ${{ needs.validate.outputs.prerelease == 'true' && '--tag next' || '' }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}

  publish-java-central:
    name: Publish Java SDK to Maven Central
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Set version
        run: mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Import GPG key
        run: echo "$MAVEN_GPG_KEY" | gpg --batch --import
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}

      - name: Deploy to Maven Central
        run: mvn deploy -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-python:
    name: Publish Python SDK to PyPI
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version
        run: sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest tests/

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  go-tag:
    name: Tag Go SDK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create and push Go SDK tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="sdks/go/v${VERSION}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          VERSION: ${{ needs.validate.outputs.version }}

  goreleaser:
    name: Release CLI (GoReleaser)
    needs: validate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
