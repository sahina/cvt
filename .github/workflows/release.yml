name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build CLI for (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (contains -alpha, -beta, -rc, etc.)
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Build and Push Docker Image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sahina/cvt-server:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.prerelease == 'false' && 'ghcr.io/sahina/cvt-server:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-node:
    name: Publish Node.js SDK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@sahina'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npmjs
        run: |
          if npm view "@sahina/cvt-sdk@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already exists on npmjs, skipping"
          else
            npm publish --access public ${{ needs.validate.outputs.prerelease == 'true' && '--tag next' || '' }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}

  publish-java-central:
    name: Publish Java SDK to Maven Central
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Set version
        run: mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Import GPG key
        run: echo "$MAVEN_GPG_KEY" | gpg --batch --import
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}

      - name: Deploy to Maven Central
        run: mvn deploy -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-python:
    name: Publish Python SDK to PyPI
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version
        run: sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest tests/

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  go-tag:
    name: Tag Go SDK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create and push Go SDK tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="sdks/go/v${VERSION}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          VERSION: ${{ needs.validate.outputs.version }}

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [validate, release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          OUTPUT="cvt-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${DATE}" \
            -o "${OUTPUT}" ./cmd/cvt
        env:
          CGO_ENABLED: '0'

      - name: Generate checksum
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          BINARY="cvt-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          sha256sum "${BINARY}" > "${BINARY}.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: |
            cvt-${{ matrix.goos }}-${{ matrix.goarch }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: [validate, build-cli]
    if: ${{ needs.validate.outputs.prerelease == 'false' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums from release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          BASE_URL="https://github.com/sahina/cvt/releases/download/${TAG}"

          for PLATFORM in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            echo "Downloading checksum for cvt-${PLATFORM}..."
            curl -sL "${BASE_URL}/cvt-${PLATFORM}.sha256" -o "cvt-${PLATFORM}.sha256"
            cat "cvt-${PLATFORM}.sha256"
          done

          # Extract SHA256 values
          echo "SHA_DARWIN_AMD64=$(awk '{print $1}' cvt-darwin-amd64.sha256)" >> $GITHUB_ENV
          echo "SHA_DARWIN_ARM64=$(awk '{print $1}' cvt-darwin-arm64.sha256)" >> $GITHUB_ENV
          echo "SHA_LINUX_AMD64=$(awk '{print $1}' cvt-linux-amd64.sha256)" >> $GITHUB_ENV
          echo "SHA_LINUX_ARM64=$(awk '{print $1}' cvt-linux-arm64.sha256)" >> $GITHUB_ENV

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: sahina/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          BASE_URL="https://github.com/sahina/cvt/releases/download/${TAG}"

          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/cvt.rb << 'FORMULA'
          class Cvt < Formula
            desc "Contract Validation Tool - Validate HTTP interactions against OpenAPI specs"
            homepage "https://github.com/sahina/cvt"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_intel do
                url "BASE_URL_PLACEHOLDER/cvt-darwin-amd64"
                sha256 "SHA_DARWIN_AMD64_PLACEHOLDER"
              end
              on_arm do
                url "BASE_URL_PLACEHOLDER/cvt-darwin-arm64"
                sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"
              end
            end

            on_linux do
              on_intel do
                url "BASE_URL_PLACEHOLDER/cvt-linux-amd64"
                sha256 "SHA_LINUX_AMD64_PLACEHOLDER"
              end
              on_arm do
                url "BASE_URL_PLACEHOLDER/cvt-linux-arm64"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              end
            end

            def install
              binary_name = "cvt-#{OS.mac? ? "darwin" : "linux"}-#{Hardware::CPU.intel? ? "amd64" : "arm64"}"
              bin.install binary_name => "cvt"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cvt version")
            end
          end
          FORMULA

          # Replace placeholders
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" homebrew-tap/Formula/cvt.rb
          sed -i "s|BASE_URL_PLACEHOLDER|${BASE_URL}|g" homebrew-tap/Formula/cvt.rb
          sed -i "s|SHA_DARWIN_AMD64_PLACEHOLDER|${SHA_DARWIN_AMD64}|g" homebrew-tap/Formula/cvt.rb
          sed -i "s|SHA_DARWIN_ARM64_PLACEHOLDER|${SHA_DARWIN_ARM64}|g" homebrew-tap/Formula/cvt.rb
          sed -i "s|SHA_LINUX_AMD64_PLACEHOLDER|${SHA_LINUX_AMD64}|g" homebrew-tap/Formula/cvt.rb
          sed -i "s|SHA_LINUX_ARM64_PLACEHOLDER|${SHA_LINUX_ARM64}|g" homebrew-tap/Formula/cvt.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/cvt.rb

      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cvt.rb
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update cvt to ${{ needs.validate.outputs.version }}"
          git push
