<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="logo-full-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="logo-full-at" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <linearGradient id="logo-full-ab" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
    <filter id="logo-full-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Badge icon -->
  <rect x="4" y="4" width="72" height="72" rx="10" fill="url(#logo-full-bg)"/>
  <rect x="4" y="4" width="72" height="72" rx="10" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Consumer arrow - top -->
  <path d="M15 18 L36 18" stroke="url(#logo-full-at)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M30.5 11 L38 18 L30.5 25" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Producer arrow - bottom -->
  <path d="M65 62 L44 62" stroke="url(#logo-full-ab)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M49.5 55 L42 62 L49.5 69" stroke="rgba(255,255,255,0.55)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center check -->
  <circle cx="40" cy="40" r="10" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <path d="M34 40 L38 44.5 L46 35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-full-glow)"/>
  <!-- CVT text -->
  <text x="100" y="54" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="700" fill="currentColor" letter-spacing="3">CVT</text>
</svg>