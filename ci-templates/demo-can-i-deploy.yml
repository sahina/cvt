# =============================================================================
# CVT Demo Workflow: Can I Deploy?
# =============================================================================
#
# PURPOSE:
# This workflow answers the critical question: "Can I safely deploy this
# schema version without breaking any consumers?" It's the final safety
# check before deploying API changes to production.
#
# WHEN TO USE:
# - Before deploying API changes to any environment
# - As a manual gate in your deployment pipeline
# - To audit which consumers would be affected by schema changes
#
# HOW IT WORKS:
# 1. Takes your new schema version as input
# 2. Queries the CVT server for all registered consumers
# 3. For each consumer, compares:
#    - The schema version they tested against (their expectation)
#    - Your new schema version (what you want to deploy)
# 4. Detects breaking changes that would affect each consumer
# 5. Reports detailed compatibility status for all consumers
#
# BREAKING CHANGES DETECTED:
# - ENDPOINT_REMOVED: An endpoint the consumer uses no longer exists
# - REQUIRED_PARAMETER_ADDED: New required parameter consumer doesn't send
# - REQUIRED_FIELD_ADDED: New required field in request body
# - TYPE_CHANGED: Field type changed (e.g., string -> number)
# - ENUM_VALUE_REMOVED: Enum value consumer uses was removed
# - RESPONSE_SCHEMA_CHANGED: Response structure consumer depends on changed
#
# IMPORTANT CONCEPTS:
# - Schema ID: Unique identifier for an API (e.g., "user-api", "order-api")
# - Schema Version: Specific version of the schema (e.g., "1.2.0", "2.0.0")
# - Consumer: A service that depends on your API and has registered its usage
# - Used Endpoints: The specific paths/methods a consumer actually calls
#
# PREREQUISITES:
# - A running CVT server with your schema registered
# - At least one consumer registered (otherwise always succeeds)
#
# =============================================================================

name: "CVT Demo: Can I Deploy?"

# -----------------------------------------------------------------------------
# TRIGGER CONFIGURATION
# -----------------------------------------------------------------------------
# Manual trigger is recommended for this workflow since it's typically
# used as a deployment gate. You control when to run the check.
#
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'CVT server address (host:port)'
        required: true
        default: 'localhost:9550'
      schema_id:
        description: 'Schema identifier to check consumers against'
        required: true
        default: 'my-api'
      schema_version:
        description: 'Schema version to check for deployment'
        required: true
        default: '1.0.0'
      environment:
        description: 'Target deployment environment (dev, staging, prod)'
        required: true
        default: 'prod'

# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------------------------------------
env:
  CVT_SERVER_URL: ${{ github.event.inputs.server_url }}
  CVT_SCHEMA_ID: ${{ github.event.inputs.schema_id }}
  CVT_SCHEMA_VERSION: ${{ github.event.inputs.schema_version }}
  CVT_ENVIRONMENT: ${{ github.event.inputs.environment }}

  # -----------------------------------------------------------------------------
  # AUTHENTICATION (Optional)
  # -----------------------------------------------------------------------------
  # Uncomment to enable API key authentication:
  #
  # CVT_API_KEY: ${{ secrets.CVT_API_KEY }}

jobs:
  can-i-deploy:
    name: Check Deployment Safety
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------------
      # STEP 1: Checkout Code
      # -------------------------------------------------------------------------
      # Needed to access the schema file if it's in the repository
      #
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # STEP 2: Display Check Configuration
      # -------------------------------------------------------------------------
      # Show the deployment check configuration before running.
      #
      - name: Display check configuration
        id: config
        run: |
          echo "=== Can I Deploy? Configuration ==="
          echo ""
          echo "Schema ID:      $CVT_SCHEMA_ID"
          echo "Schema Version: (will be extracted from schema file)"
          echo "Environment:    $CVT_ENVIRONMENT"
          echo "CVT Server:     $CVT_SERVER_URL"
          echo ""
          echo "This check will query the CVT server to determine if deploying"
          echo "this schema version will break any registered consumers."

      # -------------------------------------------------------------------------
      # STEP 3: Run Can-I-Deploy Check
      # -------------------------------------------------------------------------
      # The main event: check if your schema changes break any consumers.
      #
      # HOW IT WORKS:
      # 1. CVT loads your new schema from CVT_SCHEMA_URL
      # 2. For each registered consumer:
      #    a. Retrieves the schema version they tested against
      #    b. Loads that old schema from the server's cache
      #    c. Compares old vs new for breaking changes
      #    d. Filters to only changes affecting that consumer's used endpoints
      # 3. Aggregates results and reports per-consumer impact
      #
      # OUTPUT INCLUDES:
      # - Overall: SAFE or UNSAFE
      # - Per consumer: COMPATIBLE or BREAKING
      # - If breaking: specific changes that would break each consumer
      #
      # FAILURE BEHAVIOR:
      # - Fails if ANY consumer would be broken
      # - To proceed despite breaks, manually override or use continue-on-error
      #
      # -------------------------------------------------------------------------
      # STEP 3: Run Can-I-Deploy Check
      # -------------------------------------------------------------------------
      # The main event: check if your schema changes break any consumers.
      #
      # HOW IT WORKS:
      # 1. CVT queries for all consumers registered against this schema_id
      # 2. For each consumer, it compares their tested version against your new version
      # 3. Detects breaking changes that would affect each consumer's used endpoints
      # 4. Reports per-consumer impact and overall deployment safety
      #
      # SECURITY NOTE:
      # The --network host flag is used to allow the container to reach the CVT
      # server. On shared self-hosted runners, consider using Docker networking
      # or a service container instead for better isolation.
      #
      - name: Run can-i-deploy check
        id: can_i_deploy
        run: |
          echo "=== Can I Deploy? ==="
          echo ""
          echo "Checking if '$CVT_SCHEMA_ID' v$CVT_SCHEMA_VERSION can be safely deployed..."
          echo "Target environment: $CVT_ENVIRONMENT"
          echo ""

          # Run the can-i-deploy check
          # This is the critical command that determines deployment safety
          docker run --rm \
            --network host \
            ghcr.io/sahina/cvt-server:latest \
            cvt can-i-deploy \
              --schema "$CVT_SCHEMA_ID" \
              --version "$CVT_SCHEMA_VERSION" \
              --env "$CVT_ENVIRONMENT" \
              --server "$CVT_SERVER_URL" \
              --timeout 30 \
            2>&1 | tee /tmp/deploy-check.txt

          # Capture exit code
          RESULT=${PIPESTATUS[0]}

          if [ $RESULT -eq 0 ]; then
            echo ""
            echo "SAFE TO DEPLOY: No breaking changes detected!"
            echo "result=safe" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "UNSAFE TO DEPLOY: Breaking changes detected!"
            echo "Review the output above for specific issues."
            echo "result=unsafe" >> $GITHUB_OUTPUT
            exit 1
          fi

      # -------------------------------------------------------------------------
      # STEP 4: Generate Detailed Report
      # -------------------------------------------------------------------------
      # Create a comprehensive report in GitHub Step Summary.
      # This provides visibility for stakeholders reviewing the deployment.
      #
      - name: Generate detailed report
        if: always()
        run: |
          echo "## Can I Deploy? - Deployment Safety Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Status banner
          if [ "${{ steps.can_i_deploy.outputs.result }}" == "safe" ]; then
            echo "> **SAFE TO DEPLOY**" >> $GITHUB_STEP_SUMMARY
            echo "> No breaking changes detected for any registered consumers." >> $GITHUB_STEP_SUMMARY
          else
            echo "> **UNSAFE TO DEPLOY**" >> $GITHUB_STEP_SUMMARY
            echo "> Breaking changes detected that would affect one or more consumers." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schema ID | \`$CVT_SCHEMA_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Version | \`$CVT_SCHEMA_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVT Server | \`$CVT_SERVER_URL\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$CVT_ENVIRONMENT\` |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compatibility Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat /tmp/deploy-check.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Check output not available"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Understanding the Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**If SAFE:** You can deploy this schema version without breaking consumers." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**If UNSAFE:** Review the breaking changes and either:" >> $GITHUB_STEP_SUMMARY
          echo "1. Modify your schema to maintain backward compatibility" >> $GITHUB_STEP_SUMMARY
          echo "2. Coordinate with affected consumers to update their code" >> $GITHUB_STEP_SUMMARY
          echo "3. Version your API (e.g., /v2/) and deprecate the old version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Breaking Change Types" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| ENDPOINT_REMOVED | An endpoint was deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| REQUIRED_PARAMETER_ADDED | New required param added |" >> $GITHUB_STEP_SUMMARY
          echo "| REQUIRED_FIELD_ADDED | New required field in request |" >> $GITHUB_STEP_SUMMARY
          echo "| TYPE_CHANGED | Field type changed |" >> $GITHUB_STEP_SUMMARY
          echo "| ENUM_VALUE_REMOVED | Enum option was removed |" >> $GITHUB_STEP_SUMMARY
          echo "| RESPONSE_SCHEMA_CHANGED | Response structure changed |" >> $GITHUB_STEP_SUMMARY
