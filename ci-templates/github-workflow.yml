# CVT Contract Validation Workflow
# Copy this file to your repository's .github/workflows/ directory

name: Contract Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'openapi.json'
      - 'openapi.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'openapi.json'
      - 'openapi.yaml'

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for schema comparison

      - name: Checkout CVT
        uses: actions/checkout@v4
        with:
          repository: your-org/cvt
          path: cvt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build CVT CLI
        run: |
          cd cvt
          go build -o /usr/local/bin/cvt ./cmd/cvt

      - name: Validate Schema
        run: |
          # Validate the OpenAPI schema is valid
          cvt generate --schema ./openapi.json --list

      - name: Check for Breaking Changes
        if: github.event_name == 'pull_request'
        run: |
          # Get the base branch schema
          git show origin/${{ github.base_ref }}:openapi.json > /tmp/old-schema.json 2>/dev/null || exit 0

          # Compare schemas
          cvt compare --old /tmp/old-schema.json --new ./openapi.json

      - name: Validate Test Fixtures
        run: |
          # Validate any fixture files in the test directory
          for fixture in tests/fixtures/*.json; do
            if [ -f "$fixture" ]; then
              echo "Validating: $fixture"
              cvt validate --schema ./openapi.json --interaction "$fixture"
            fi
          done

      - name: Generate Contract Report
        if: always()
        run: |
          echo "## Contract Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          cvt generate --schema ./openapi.json --list >> $GITHUB_STEP_SUMMARY
