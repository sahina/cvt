# CVT Contract Validation for GitLab CI
# Include this template in your .gitlab-ci.yml:
#   include:
#     - project: 'your-org/cvt'
#       file: '/ci-templates/gitlab-ci.yml'
#
# Or copy the jobs you need into your own .gitlab-ci.yml

variables:
  CVT_SCHEMA_PATH: "openapi.json"
  CVT_GO_VERSION: "1.21"

.cvt-base:
  image: golang:${CVT_GO_VERSION}
  before_script:
    - |
      # Clone and build CVT CLI
      git clone --depth 1 https://github.com/your-org/cvt.git /tmp/cvt
      cd /tmp/cvt
      go build -o /usr/local/bin/cvt ./cmd/cvt
      cd $CI_PROJECT_DIR

# Validate that the OpenAPI schema is valid and list endpoints
cvt:validate-schema:
  extends: .cvt-base
  stage: test
  script:
    - echo "Validating schema at ${CVT_SCHEMA_PATH}"
    - cvt generate --schema "${CVT_SCHEMA_PATH}" --list
  rules:
    - changes:
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"

# Check for breaking changes between branches
cvt:breaking-changes:
  extends: .cvt-base
  stage: test
  script:
    - |
      echo "Checking for breaking changes..."

      # Fetch the target branch schema
      git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
      git show origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:${CVT_SCHEMA_PATH} > /tmp/old-schema.json || exit 0

      # Compare schemas
      cvt compare --old /tmp/old-schema.json --new "${CVT_SCHEMA_PATH}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

# Validate test fixtures against the schema
cvt:validate-fixtures:
  extends: .cvt-base
  stage: test
  script:
    - |
      echo "Validating test fixtures..."
      FAILED=0

      for fixture in tests/fixtures/*.json; do
        if [ -f "$fixture" ]; then
          echo "Validating: $fixture"
          if ! cvt validate --schema "${CVT_SCHEMA_PATH}" --interaction "$fixture"; then
            echo "FAILED: $fixture"
            FAILED=1
          fi
        fi
      done

      if [ $FAILED -eq 1 ]; then
        echo "Some fixtures failed validation"
        exit 1
      fi
  rules:
    - exists:
        - tests/fixtures/*.json

# Generate test fixtures from schema (manual trigger)
cvt:generate-fixtures:
  extends: .cvt-base
  stage: build
  script:
    - mkdir -p generated-fixtures
    - |
      # List all endpoints and generate fixtures
      cvt generate --schema "${CVT_SCHEMA_PATH}" --list | while read endpoint; do
        METHOD=$(echo $endpoint | awk '{print $1}')
        PATH=$(echo $endpoint | awk '{print $2}')
        FILENAME=$(echo "${METHOD}_${PATH}" | sed 's/[\/{}]/_/g')
        echo "Generating fixture for: $METHOD $PATH"
        cvt generate --schema "${CVT_SCHEMA_PATH}" --method "$METHOD" --path "$PATH" -o "generated-fixtures/${FILENAME}.json" || true
      done
  artifacts:
    paths:
      - generated-fixtures/
    expire_in: 1 week
  rules:
    - when: manual

# Full contract validation pipeline job
cvt:full-validation:
  extends: .cvt-base
  stage: test
  script:
    - echo "=== CVT Contract Validation ==="
    - echo ""
    - echo "1. Validating schema..."
    - cvt generate --schema "${CVT_SCHEMA_PATH}" --list
    - echo ""
    - echo "2. Validating fixtures..."
    - |
      for fixture in tests/fixtures/*.json; do
        if [ -f "$fixture" ]; then
          cvt validate --schema "${CVT_SCHEMA_PATH}" --interaction "$fixture"
        fi
      done
    - echo ""
    - echo "=== Validation Complete ==="
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
