<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="arrow-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <linearGradient id="arrow-bot" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
    <filter id="check-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Badge background -->
  <rect x="2" y="2" width="96" height="96" rx="12" fill="url(#badge-grad)"/>
  <!-- Inner highlight edge -->
  <rect x="2" y="2" width="96" height="96" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Consumer arrow (right-pointing) - top -->
  <path d="M14 22 L42 22" stroke="url(#arrow-top)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M35 13 L45 22 L35 31" stroke="white" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Producer arrow (left-pointing) - bottom -->
  <path d="M86 78 L58 78" stroke="url(#arrow-bot)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M65 69 L55 78 L65 87" stroke="rgba(255,255,255,0.55)" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center validation check -->
  <circle cx="50" cy="50" r="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <path d="M42 50 L48 56 L58 43" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#check-glow)"/>
</svg>