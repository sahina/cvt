# Grafana dashboard provisioning configuration
#
# This file tells Grafana to automatically load dashboards from the
# specified directory when the container starts.

apiVersion: 1

providers:
  - name: 'CVT Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
