# Grafana datasource configuration for Prometheus
#
# This file configures Grafana to automatically connect to the Prometheus
# instance running in the same Docker network.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
