plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.6'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.grpc:grpc-netty-shaded:1.78.0'
    implementation 'io.grpc:grpc-protobuf:1.78.0'
    implementation 'io.grpc:grpc-stub:1.78.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Annotation dependencies for generated code
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // Optional producer validation dependencies (provided by users)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'org.springframework:spring-webmvc:6.2.8'

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.78.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir '../../api/protos'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/cvt/proto/**',
                'com/cvt/examples/**',
                'com/cvt/sdk/producer/adapters/**'  // Requires external deps (servlet, spring)
            ])
        }))
    }
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/cvt/proto/**',
                'com/cvt/examples/**',
                'com/cvt/sdk/producer/adapters/**'  // Requires external deps (servlet, spring)
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }
}

