[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvt-sdk"
version = "0.1.0"
description = "Contract Validator Toolkit - Python SDK for validating HTTP interactions against OpenAPI schemas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "sahina" }]
keywords = ["openapi", "contract-testing", "grpc", "api-validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["grpcio>=1.76.0", "protobuf>=6.33.2"]

[project.urls]
Homepage = "https://github.com/sahina/cvt"
Documentation = "https://github.com/sahina/cvt/tree/main/sdks/python"
Repository = "https://github.com/sahina/cvt"
Issues = "https://github.com/sahina/cvt/issues"

[project.optional-dependencies]
requests = ["requests>=2.32.0"]
all = ["requests>=2.32.0"]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "grpcio-tools>=1.76.0",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.14.10",
  "requests>=2.32.0",
  "responses>=0.25.0",
]

[tool.ruff]
exclude = ["cvt_sdk/proto/*"]

[tool.pytest.ini_options]
# Allow tests to pass when no tests are collected (SDK is stub implementation)
addopts = "--tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Exit with code 0 even if no tests are collected
norecursedirs = ".git .tox dist build *.egg"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["cvt_sdk/proto/*"]

[tool.coverage.report]
omit = ["cvt_sdk/proto/*"]

